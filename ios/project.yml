# xcodegen 으로 Toaster.xcodeproj 를 만든다:  cd ios && xcodegen
name: Toaster
options:
  bundleIdPrefix: app.yechan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Toaster:
    type: application
    platform: iOS
    sources: [Toaster]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yechan.toaster
        PRODUCT_NAME: Toaster
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Toaster
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 받은 이미지를 사진 앱에 저장하려면 권한이 필요해요.
        # 기본 서버 주소. 실기기에서는 Mac의 IP나 배포 주소로 바꾸거나 앱 설정에서 변경.
        TOASTER_API_URL: http://127.0.0.1:8000
    info:
      path: Toaster/Info.plist
      properties:
        ToasterAPIURL: $(TOASTER_API_URL)
        NSAppTransportSecurity:
          # 개발 중 로컬 서버(http) 접속 허용. 배포 서버는 https 사용.
          NSAllowsLocalNetworking: true
