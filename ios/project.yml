# xcodegen 으로 Toaster.xcodeproj 를 만든다:  cd ios && xcodegen
name: Toaster
options:
  bundleIdPrefix: app.yechan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  # 공유 시트·메뉴 같은 시스템 문구를 한국어로
  developmentLanguage: ko
packages:
  # HTML 파싱·CSS 선택자 (서버 없이 아이폰에서 페이지를 분석)
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # 아이폰·아이패드·맥 앱을 한 타깃으로 만든다 (Xcode 에서 실행 대상만 고르면 됨)
  Toaster:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Toaster
        excludes: ["*.entitlements"]
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yechan.toaster
        PRODUCT_NAME: Toaster
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Toaster
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # 아이패드는 네 방향 모두 (화면 나눠 쓰기·Stage Manager 에 필요)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 받은 이미지와 영상을 사진 앱에 저장하려면 권한이 필요합니다.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # 맥: 샌드박스 안에서 인터넷 접속과 사용자가 고른 폴더·다운로드 폴더 쓰기만 허용
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Toaster/Toaster-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # 개발자 팀 없이도 이 맥에서 바로 실행되게 로컬 서명 ("Sign to Run Locally"). 팀이 있으면 Xcode 에서 골라도 된다.
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        CODE_SIGN_STYLE[sdk=macosx*]: Manual
    info:
      path: Toaster/Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
