# toaster-client 웹 실행
#   cd toaster-client/deploy
#   cp .env.example .env      # 필요하면 WEB_PORT 변경
#   docker compose up -d --build
#
# 따로 띄울 서버는 없다.
name: toaster-client

services:
  web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile
    image: toaster-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
